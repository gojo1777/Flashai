<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FLASH AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Arial,sans-serif}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 18%,#17202c,#080a0d 45%,#030405)}
header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:21px;font-weight:900;letter-spacing:2px}.logo span{color:#00e5ff}
.status{font-size:11px;color:#9aa6b2;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#ff394d;box-shadow:0 0 10px #ff394d}.dot.ready{background:#00ff9d;box-shadow:0 0 13px #00ff9d}
.camera{position:relative;flex:1;margin:0 14px;border:1px solid #202833;border-radius:28px;overflow:hidden;background:#000}
video,#output{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}#output{transform:scaleX(-1);pointer-events:none}
.scan{position:absolute;left:15px;right:15px;height:1px;top:30%;background:#00e5ff;box-shadow:0 0 15px #00e5ff;opacity:.45;animation:scan 3s infinite ease-in-out}
@keyframes scan{50%{top:72%}}
.corner{position:absolute;width:35px;height:35px;border-color:#00e5ff;border-style:solid}.c1{top:15px;left:15px;border-width:2px 0 0 2px}.c2{top:15px;right:15px;border-width:2px 2px 0 0}.c3{bottom:15px;left:15px;border-width:0 0 2px 2px}.c4{bottom:15px;right:15px;border-width:0 2px 2px 0}
.info{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:end}
.card{padding:10px 13px;border-radius:14px;background:rgba(5,8,12,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px)}
.label{font-size:9px;color:#71808e;letter-spacing:1.5px}.value{margin-top:4px;font-size:18px;font-weight:800}#finger{color:#00e5ff}#torch{color:#ff394d}#torch.on{color:#00ff9d;text-shadow:0 0 15px #00ff9d}
.bottom{padding:14px 20px 22px;text-align:center;min-height:105px}.instruction{font-size:13px;color:#a5b0bb;line-height:1.4}.instruction strong{color:#fff}
.pulse{position:absolute;inset:0;border:2px solid #00ff9d;border-radius:28px;opacity:0;pointer-events:none}.pulse.on{animation:p .7s infinite alternate}@keyframes p{to{opacity:.75;box-shadow:inset 0 0 50px rgba(0,255,157,.35)}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">FLASH<span>AI</span></div><div class="status"><i id="dot" class="dot"></i><span id="status">STARTING</span></div></header>
<div class="camera">
<video id="video" autoplay playsinline muted></video><canvas id="output"></canvas><div class="scan"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="info"><div class="card"><div class="label">FINGERS</div><div id="finger" class="value">0 / 5</div></div><div class="card"><div class="label">REAL HARDWARE FLASH</div><div id="torch" class="value">OFF</div></div></div>
<div id="pulse" class="pulse"></div>
</div>
<div class="bottom"><div id="instruction" class="instruction">Opening selfie camera…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('output'), ctx=canvas.getContext('2d');
const finger=document.getElementById('finger'), torch=document.getElementById('torch'), status=document.getElementById('status'), dot=document.getElementById('dot'), instruction=document.getElementById('instruction'), pulse=document.getElementById('pulse');
let torchOn=false,lastOpen=false,stable=0;

function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fingers(l){
  let n=0;
  if(d(l[4],l[5])>d(l[3],l[5])) n++;
  if(l[8].y<l[6].y)n++;
  if(l[12].y<l[10].y)n++;
  if(l[16].y<l[14].y)n++;
  if(l[20].y<l[18].y)n++;
  return n;
}
function hardwareTorch(on){
  if(!window.AndroidTorch || !AndroidTorch.isSupported()){
    torch.textContent='UNAVAILABLE'; return false;
  }
  const ok=AndroidTorch.setTorch(on);
  if(ok){
    torchOn=on; torch.textContent=on?'ON':'OFF'; torch.classList.toggle('on',on); pulse.classList.toggle('on',on);
  }
  return ok;
}

const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.65});
hands.onResults(r=>{
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);
  if(r.multiHandLandmarks&&r.multiHandLandmarks.length){
    const l=r.multiHandLandmarks[0], n=fingers(l); finger.textContent=n+' / 5';
    drawConnectors(ctx,l,HAND_CONNECTIONS,{color:'#00e5ff',lineWidth:3});
    drawLandmarks(ctx,l,{color:'#fff',lineWidth:1,radius:3});
    const open=n===5;
    if(open===lastOpen)stable++;else{stable=0;lastOpen=open}
    if(stable>=4){
      if(open&&!torchOn){hardwareTorch(true)}
      if(!open&&torchOn){hardwareTorch(false)}
    }
    instruction.innerHTML=open?'🤚 <strong>5 FINGERS — REAL FLASH ON</strong>':'Show all <strong>5 fingers</strong> to activate';
  }else{
    finger.textContent='0 / 5';
    if(torchOn)hardwareTorch(false);
    instruction.innerHTML='Show your hand to the <strong>selfie camera</strong>';
  }
});

async function start(){
 try{
   if(!window.AndroidTorch || !AndroidTorch.isSupported()){
     torch.textContent='UNAVAILABLE';
     instruction.textContent='Rear hardware torch is not available on this device.';
   }
   const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
   video.srcObject=s; await video.play();
   status.textContent='AI READY';dot.classList.add('ready');
   const cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:1280,height:720});cam.start();
 }catch(e){
   status.textContent='CAMERA ERROR';instruction.textContent='Allow camera permission and reopen the app.';
 }
}
window.addEventListener('pagehide',()=>{try{hardwareTorch(false)}catch(e){}});
start();
</script>
</body>
</html>
